<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fernando Morales Ralda — Software Developer building SaaS products end to end with React, Flutter, Node.js, NestJS and Java." />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Fernando Morales Ralda — Software Developer" />
    <meta property="og:description" content="SaaS products built end to end: web, mobile and backend services." />
    <meta property="og:url" content="https://ferjoo.github.io/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fernando Morales Ralda — Software Developer</title>
    <script>
      // Apply the saved or system theme before first paint so the page never flashes.
      try {
        var saved = localStorage.getItem('portfolio-theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
